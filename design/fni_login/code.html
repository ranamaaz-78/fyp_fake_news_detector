<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar -->
<nav class="fixed top-0 w-full bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md z-50">
<div class="flex justify-between items-center h-16 px-margin-mobile md:px-8 max-w-container-max mx-auto">
<div class="flex items-center gap-2">
<span class="font-headline-lg text-headline-lg font-bold text-primary">FNI System</span>
</div>
<div class="flex items-center gap-6">
<a class="hidden md:block font-label-bold text-label-bold text-secondary hover:text-primary transition-colors" href="#">Support</a>
<a class="font-label-bold text-label-bold text-primary dark:text-primary-fixed font-bold border-b-2 border-primary" href="#">Don't have an account? Sign up</a>
</div>
</div>
</nav>
<!-- Main Content: Login Shell -->
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-margin-mobile">
<div class="w-full max-w-[440px] bg-surface-container-lowest login-card rounded-xl overflow-hidden">
<!-- Header Section -->
<div class="p-8 pb-4 text-center">
<h1 class="font-headline-xl-mobile md:font-headline-xl text-headline-xl-mobile md:text-headline-xl text-on-background mb-2">Welcome back</h1>
<p class="font-body-md text-body-md text-secondary">Log in to view your prediction history.</p>
</div>
<!-- Form Section -->
<div class="p-8 pt-4">
<form class="space-y-6" id="loginForm" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface-variant block" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-md text-body-md" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="password">Password</label>
<a class="font-label-bold text-label-bold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-4 bg-primary-container text-white font-label-bold text-label-bold rounded-lg hover:bg-primary-container/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm hover:shadow-md" type="submit">
<span class="material-symbols-outlined" data-weight="fill">login</span>
                        Log in
                    </button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center pt-6 border-t border-surface-variant">
<p class="font-body-sm text-body-sm text-secondary">
                        Don't have an account? 
                        <a class="text-primary font-bold hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer -->

</div>
</div>

<!-- Micro-interactions Script -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Add subtle animation on input focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#1e40af';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#757684';
            });
        });

        // Simple form handling simulation
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span> Authenticating...`;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success`;
                btn.classList.remove('bg-primary-container');
                btn.classList.add('bg-status-real');
                
                setTimeout(() => {
                    alert('Login successful! Redirecting to prediction history...');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-status-real', 'opacity-80', 'cursor-not-allowed');
                    btn.classList.add('bg-primary-container');
                }, 1000);
            }, 1500);
        });
    </script>
